<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería de Arte — Three.js Demo</title>

<!--
  Import Map — resuelve especificadores bare ("three", etc.) a URLs del CDN.
  Soportado en Chrome 89+, Firefox 108+, Safari 16.4+.

  Para un proyecto con bundler (Vite / Webpack / Rollup):
    - Elimina este bloque <script type="importmap">
    - Instala: npm install three
    - Los imports en los .js quedan igual: import * as THREE from 'three'
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js"
  }
}
</script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    font-family: 'Georgia', serif;
    overflow: hidden;
    cursor: crosshair;
  }

  #canvas-container {
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  #renderer-canvas {
    position: absolute;
    top: 0; left: 0;
  }

  /* Overlay donde InfoPanelManager inyecta los paneles HTML */
  #css3d-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ── Paneles de obra ─────────────────────────────────────────── */
  .obra-panel {
    background: rgba(8, 8, 18, 0.82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 18px 22px;
    width: 240px;
    color: #e8e0d0;
    font-family: 'Georgia', serif;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
  }

  .obra-panel .num {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c9a96e;
    margin-bottom: 6px;
    font-family: monospace;
  }

  .obra-panel h3 {
    font-size: 17px;
    font-weight: normal;
    color: #f0ead8;
    margin-bottom: 4px;
    line-height: 1.2;
  }

  .obra-panel .artista {
    font-size: 12px;
    color: #8a8070;
    font-style: italic;
    margin-bottom: 10px;
  }

  .obra-panel .divider {
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 10px 0;
  }

  .obra-panel .desc {
    font-size: 12px;
    line-height: 1.6;
    color: #b0a898;
  }

  .obra-panel .precio {
    margin-top: 10px;
    font-size: 11px;
    color: #c9a96e;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: monospace;
  }

  /* ── HUD instrucciones ──────────────────────────────────────── */
  #hud {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(8,8,18,0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 10px 24px;
    color: rgba(255,255,255,0.5);
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 1px;
    pointer-events: none;
    white-space: nowrap;
  }

  #hud span { color: rgba(201,169,110,0.9); margin: 0 4px; }

  /* ── Dot de proximidad ──────────────────────────────────────── */
  #proximity-dot {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    pointer-events: none;
    transition: background 0.2s, transform 0.2s;
  }

  #proximity-dot.near {
    background: rgba(201,169,110,0.9);
    transform: translate(-50%, -50%) scale(1.8);
  }

  /* ── Sidebar info técnica ───────────────────────────────────── */
  #sidebar {
    position: fixed;
    top: 24px; right: 24px;
    background: rgba(8,8,18,0.75);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 16px 18px;
    color: rgba(255,255,255,0.45);
    font-family: monospace;
    font-size: 10px;
    line-height: 1.8;
    letter-spacing: 0.5px;
    pointer-events: none;
    min-width: 180px;
  }

  #sidebar .label { color: rgba(201,169,110,0.7); }

  /* ── Título ─────────────────────────────────────────────────── */
  #title-overlay {
    position: fixed;
    top: 24px; left: 28px;
    pointer-events: none;
  }

  #title-overlay h1 {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(201,169,110,0.8);
    font-weight: normal;
    font-family: monospace;
  }

  #title-overlay p {
    font-size: 11px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 2px;
    margin-top: 3px;
    font-family: monospace;
  }

  /* ── Pantalla de carga ──────────────────────────────────────── */
  #loading {
    position: fixed;
    inset: 0;
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 999;
    transition: opacity 0.8s ease;
  }

  #loading h2 {
    color: rgba(201,169,110,0.9);
    font-family: monospace;
    letter-spacing: 4px;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .loader-bar {
    width: 200px;
    height: 1px;
    background: rgba(255,255,255,0.1);
    position: relative;
    overflow: hidden;
  }

  .loader-bar::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: rgba(201,169,110,0.8);
    animation: loadSlide 1.2s ease-in-out infinite;
  }

  @keyframes loadSlide { to { left: 100%; } }
</style>
</head>
<body>

<div id="loading">
  <h2>Cargando Galería</h2>
  <div class="loader-bar"></div>
</div>

<div id="canvas-container">
  <canvas id="renderer-canvas"></canvas>
  <div id="css3d-container"></div>
</div>

<div id="title-overlay">
  <h1>Sala I — Esculturas</h1>
  <p>Three.js Demo · GLB Pipeline</p>
</div>

<div id="sidebar">
  <div><span class="label">POSICIÓN</span></div>
  <div id="pos-x">X: 0.00</div>
  <div id="pos-z">Z: 0.00</div>
  <div style="margin-top:8px;"><span class="label">LUCES</span></div>
  <div>Ambient ✓</div>
  <div>Directional ✓</div>
  <div>Spot × 3 ✓</div>
  <div style="margin-top:8px;"><span class="label">ANIMACIONES</span></div>
  <div id="anim-status">Idle</div>
</div>

<div id="hud">
  <span>W A S D</span> mover &nbsp;·&nbsp; <span>Mouse</span> girar cámara &nbsp;·&nbsp; Acércate a las obras
</div>

<div id="proximity-dot"></div>

<!-- Punto de entrada del módulo ES. Todo el JS parte desde aquí. -->
<script type="module" src="./js/main.js"></script>
</body>
</html>
